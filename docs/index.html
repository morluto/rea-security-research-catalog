<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Vulnerability Detection Skills</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow" id="siteEyebrow"></p>
      <h1 id="siteTitle"></h1>
      <p class="subtitle" id="siteSubtitle"></p>
      <p class="subtitle-sm" id="siteAudience"></p>
      <div class="hero-panels">
        <section class="info-panel">
          <h2 id="howToUseTitle"></h2>
          <p id="howToUseText"></p>
        </section>
        <section class="info-panel">
          <h2 id="scopeTitle"></h2>
          <p id="scopeText"></p>
        </section>
      </div>
      <div class="stats-grid" id="statsGrid" aria-label="Catalog statistics"></div>
      <div class="search-bar">
        <label class="sr-only" for="search" id="searchLabel">Search</label>
        <input type="text" id="search" placeholder="" autocomplete="off">
        <span id="count"></span>
      </div>
      <div class="cat-nav" id="catNav"></div>
    </div>
  </header>

  <main class="container">
    <section class="browse-layout">
      <aside class="filters-panel">
        <div class="filter-block">
          <h2 id="categoryFilterTitle"></h2>
          <p class="filter-note" id="categoryFilterText"></p>
          <div class="checkbox-list" id="categoryFilters"></div>
        </div>
        <div class="filter-block">
          <h2 id="platformFilterTitle"></h2>
          <p class="filter-note" id="platformFilterText"></p>
          <div class="checkbox-list" id="platformFilters"></div>
        </div>
        <div class="filter-block compact-legend">
          <h2 id="legendTitle"></h2>
          <div class="tag-legend" id="tagLegend"></div>
          <p class="legend-note" id="legendNote"></p>
        </div>
      </aside>
      <section class="results-panel">
        <div class="results-head">
          <div>
            <h2 id="resultsTitle"></h2>
            <p class="filter-note" id="resultsText"></p>
          </div>
          <div class="active-filter-chips" id="activeFilterChips"></div>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
        <section class="prompt-panel inline-panel" aria-label="Install prompt builder">
          <div class="prompt-panel-head">
            <div>
              <h2 id="selectionTitle"></h2>
              <p id="selectionText"></p>
            </div>
            <div class="selection-count-block">
              <span class="selection-count-label" id="selectionCountLabel"></span>
              <strong class="selection-count-value" id="selectionCount">0</strong>
            </div>
          </div>
          <textarea id="promptOutput" class="prompt-output" readonly></textarea>
          <div class="prompt-actions">
            <button type="button" class="action-btn primary" id="copyPromptBtn"></button>
            <button type="button" class="action-btn" id="clearSelectionBtn"></button>
          </div>
        </section>
      </section>
    </section>
  </main>

  <footer>
    <div class="container" id="footerContent"></div>
  </footer>

  <noscript>
    <div class="container empty-state">This catalog requires JavaScript to render the generated dataset.</div>
  </noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
